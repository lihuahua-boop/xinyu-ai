services:
  - type: web
    name: xinyu-ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    env:
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        value: your-key-here
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
